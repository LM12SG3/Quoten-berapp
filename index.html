<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Quotentipp">

<style>
:root{--bg:#D9D9D9;--ink:#1A0706;--mut:#55100D;--card:#EFEDED;--ln:#B3AEAE;--hl:#DD0200;--ac:#DD0200;--wa:#A30200;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1A0706;--ink:#D9D9D9;--mut:#C9A9A6;--card:#55100D;--ln:#7C2B26;--wa:#FF8F85;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1A0706;--ink:#D9D9D9;--mut:#C9A9A6;--card:#55100D;--ln:#7C2B26;--wa:#FF8F85;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Avenir Next","Helvetica Neue",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 14px 48px}
h1{font-size:26px;margin:4px 0 2px;letter-spacing:-.02em}
h2{font-size:15px;margin:22px 0 8px;color:var(--mut);font-weight:600}
.st{color:var(--mut);font-size:13px;margin:0 0 12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin:10px 0}
label{font-size:13px;color:var(--mut);display:flex;flex-direction:column;gap:4px}
input,select,.btn{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:9px 10px;min-height:42px}
input[type=number],#q{width:96px}
.btn{cursor:pointer;display:inline-flex;align-items:center;font-weight:600;border-color:var(--ac)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.box,.g{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px 14px;margin:8px 0}
.m{display:flex;justify-content:space-between;color:var(--mut);font-size:13px}
.t{font-size:17px;margin:4px 0 2px}.t b{font-weight:700}
.o{font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums}
.p{display:flex;gap:8px;margin-top:10px}
.c{flex:1;background:var(--hl);color:#fff;border-radius:8px;padding:8px 10px;display:flex;flex-direction:column}
.c b{font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.c span{font-size:12px}
details{margin-top:8px;font-size:14px}summary{cursor:pointer;color:var(--ink);font-weight:600;padding:6px 0}
details p{margin:4px 0;font-variant-numeric:tabular-nums}
.w{color:var(--wa)}
textarea{width:100%;font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:8px;margin-top:6px}
#pbk section{border-top:1px solid var(--ln);margin-top:10px;padding-top:8px}
#pbk table{font-size:12px}
.x{background:none;border:0;color:var(--ink);font:inherit;min-height:32px;margin-left:auto}
.msg{color:var(--mut);padding:18px 4px}
input[type=date]{width:150px}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}th,td{text-align:right;padding:5px 3px;border-bottom:1px solid var(--ln)}th:first-child,td:first-child{text-align:left}
</style></head><body><main>
<h1>Quotentipp</h1>
<p class="st" id="st"></p>
<div class="row">
<label>Fenster in %<input id="w" type="number" min="1" max="100" step="1" value="5" inputmode="numeric"></label>
<label>Liga<select id="lg"><option value="">Alle</option></select></label>
</div>
<details class="box" id="pb"><summary>Daten einfügen</summary><textarea id="pt" rows="4" placeholder="Zeilen aus »Rohdaten« kopieren (Spalten Match ID bis Zustand, Kopfzeile optional) und hier einfügen"></textarea><div class="row"><button class="btn" id="pa">Ergänzen</button><button class="btn" id="pr">Alles ersetzen</button></div><label style="flex-direction:row;align-items:center"><input type="checkbox" id="fc" style="min-height:0;margin-right:8px">Bei gleicher ID auch andere Teams überschreiben</label><div class="row"><button class="btn" id="bk">Backup kopieren</button><button class="btn" id="bs">Backup speichern</button><label class="btn"><input type="file" id="bf" accept=".tsv,.txt,.csv,text/*" hidden>Backup laden</label><button class="btn" id="rs">Auf eingebauten Stand</button></div></details>
<div class="box"><label>Einzelne Favoritenquote<input id="q" inputmode="decimal" placeholder="2,10"></label><div id="qr"></div></div>
<details class="box" id="pq"><summary>Quoten aus PDF</summary><p class="o">Wettseiten-PDFs wählen, auch mehrere. Die Quoten werden offenen Spielen zugeordnet und setzen sie auf »vorbereitet«.</p><div class="row"><button class="btn" id="pk">PDFs wählen</button><input type="file" id="pf" accept="application/pdf" multiple hidden></div><div id="ps" class="o"></div><div id="pbk"></div><div class="row"><button class="btn" id="pu">Übernehmen</button><button class="btn" id="pz">Leeren</button></div></details>
<details class="box" id="rb"><summary>Ergebnisse einfügen</summary><textarea id="rt" rows="3" placeholder="Ausgabe des Kurzbefehls hier einfügen"></textarea><div class="row"><button class="btn" id="rz">Zuordnen</button><button class="btn" id="ral">Gelernte Namen löschen</button></div><div id="rv"></div></details>
<details class="box" id="ss"><summary>Saisonsumme der erwarteten Punkte</summary><div class="row"><label>Von<input type="date" id="sf"></label><label>Bis<input type="date" id="sto"></label></div><button class="btn" id="sb">Berechnen</button><div id="sr"></div></details>
<div id="list"></div>
</main>
